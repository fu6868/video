name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-app.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Compile and test (temporary data, no model download)
        run: |
          python -m compileall -q backend scripts tests
          python -m pytest tests -q
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Validate source package
        run: python scripts/package_source.py --output releases/video-source.zip
